<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Prop Tracker — Results</title>
<link rel="stylesheet" href="site.css">
<style>
  h2 { font-size: 16px; color: #8b98a5; font-weight: 600; margin: 28px 0 10px; }
  .overall-card { display: flex; gap: 24px; padding: 16px; background: #1c2733;
                  border-radius: 6px; margin-bottom: 8px; align-items: baseline; flex-wrap: wrap; }
  .overall-card .big { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .overall-card .sub { color: #8b98a5; font-size: 13px; }
  .caveat { color: #8b98a5; font-size: 12px; margin: 4px 0 8px; line-height: 1.5; }
  .show { color: #8b98a5; font-size: 12px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .show select { background: #1c2733; color: #e6edf3; border: 1px solid #263140; border-radius: 4px; padding: 4px 8px; font-size: 13px; }
  .result-tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .result-hit { background: #1a4620; color: #3fb950; }
  .result-miss { background: #2d1a1a; color: #f85149; }
  .result-push { background: #2d2a1a; color: #d4a72c; }
  .thr-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 4px 0 8px; }
  @media (max-width: 760px) { .thr-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .thr-card { background: #1c2733; border: 1px solid #263140; border-radius: 8px; padding: 14px 16px; }
  .thr-card .lbl { color: #8b98a5; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .thr-card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
  .thr-card .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .thr-card .rec { color: #8b98a5; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .thr-bar { position: relative; height: 6px; background: #263140; border-radius: 3px; }
  .thr-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #3fb950; border-radius: 3px; }
  .thr-bar .fill.below { background: #d4a72c; }
  .thr-bar .be { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #e6edf3; opacity: .7; }
</style>
</head>
<body>
<h1>NHL Prop Tracker</h1>
<nav>
  <a href="index.html">Props</a>
  <a href="results.html" class="active">Results</a>
  <a href="backtest.html">Backtest</a>
</nav>
<div class="meta" id="meta">Loading...</div>
<div class="show" id="calbar" style="display:none">Probabilities:
  <select id="calmode"><option value="cal">Calibrated</option><option value="raw">Raw model</option></select>
  <span class="caveat" id="calnote" style="margin:0"></span></div>
<div id="content"></div>

<script>
// Every graded pick is tracked here, not just ones that cleared a threshold: this is the model's
// honest hit rate and calibration. Headline props and experimental props never mix.
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => x == null ? "—" : (x * 100).toFixed(1) + "%";
const RESULT = {h: "hit", m: "miss", p: "push"};
const PROBS = [["__all__", "All probabilities"], ["50-60", "50-60%"], ["60-65", "60-65%"], ["65-70", "65-70%"],
               ["70-80", "70-80%"], ["80+", "80%+"]];
const BUCKETS = [["50-55%", .50, .55], ["55-60%", .55, .60], ["60-65%", .60, .65], ["65-70%", .65, .70],
                 ["70-80%", .70, .80], ["80-100%", .80, 1.01]];

function summarize(codes) {
  const pushes = codes.filter(c => c === "p").length;
  const dec = codes.filter(c => c === "h" || c === "m");
  const hits = dec.filter(c => c === "h").length;
  return {n: dec.length, hits, pushes, rate: dec.length ? hits / dec.length : null};
}
function inProb(p, key) {
  if (key === "__all__") return true;
  if (key === "80+") return p >= 0.8;
  const [lo, hi] = key.split("-").map(v => +v / 100);
  return p >= lo && p < hi;
}
function inDate(d, key, latest) {
  if (key === "__all__") return true;
  if (key.startsWith("last")) {
    const days = +key.slice(4), cut = new Date(latest + "T00:00:00");
    cut.setDate(cut.getDate() - days + 1);
    return new Date(d + "T00:00:00") >= cut;
  }
  return d === key;
}
function slope(rows) { return slopeXY(rows.map(p => p.m - p.l), rows.map(p => p.a - p.l)); }
function slopeXY(x, y) {
  const n = x.length;
  if (n < 10) return null;
  const xm = x.reduce((a, b) => a + b, 0) / n, ym = y.reduce((a, b) => a + b, 0) / n;
  let sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { sxx += (x[i] - xm) ** 2; sxy += (x[i] - xm) * (y[i] - ym); }
  if (!sxx) return null;
  const b = sxy / sxx;
  let sse = 0;
  for (let i = 0; i < n; i++) sse += (y[i] - ym - b * (x[i] - xm)) ** 2;
  return {b, se: Math.sqrt(sse / (n - 2) / sxx)};
}
const tag = x => `<span class="result-tag result-${RESULT[x]}">${RESULT[x].toUpperCase()}</span>`;

function render(data) {
  const labels = data.labels || {};
  const L = c => labels[c] || c;
  const all = data.picks || [];
  const content = document.getElementById("content");
  document.getElementById("meta").textContent = `Updated ${new Date(data.generated_at).toLocaleString()}` +
    (data.voids ? ` · ${data.voids} voided (player didn't play / game not played)` : "") +
    (data.excluded ? ` · ${data.excluded} excluded by hand` : "");
  if (!all.length) {
    content.innerHTML = `<div class="empty">No graded picks yet. Results show up here once a day's props had a real
      posted line AND that game is final (the morning run after each slate).</div>`;
    return;
  }

  const head = all.filter(p => p.hd), exp = all.filter(p => !p.hd);
  const dates = [...new Set(all.map(p => p.d))].sort().reverse();
  const latest = dates[0];
  const DATE_OPTS = `<option value="__all__">All dates</option><option value="last7">Last 7 days</option>
    <option value="last30">Last 30 days</option>` + dates.map(d => `<option value="${d}">${d}</option>`).join("");
  const propOpts = rows => `<option value="__all__">All props</option>` +
    [...new Set(rows.map(p => p.c))].map(c => `<option value="${c}">${esc(L(c))}</option>`).join("");
  const PROB_OPTS = PROBS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  const show = (id, rows, {prop = true, prob = true} = {}) => `<div class="show">Show:
      <select id="${id}-date">${DATE_OPTS}</select>
      ${prop ? `<select id="${id}-prop">${propOpts(rows)}</select>` : ""}
      ${prob ? `<select id="${id}-prob">${PROB_OPTS}</select>` : ""}</div>`;
  const filt = (id, rows) => {
    const v = k => (document.getElementById(`${id}-${k}`) || {}).value || "__all__";
    return rows.filter(p => inDate(p.d, v("date"), latest) && (v("prop") === "__all__" || p.c === v("prop"))
      && inProb(p.p, v("prob")));
  };

  content.innerHTML = `
    <h2 style="margin-top:4px">Hit rate above a probability</h2>
    <div class="show">Show:
      <select id="thr-scope"><option value="hd">Headline props</option><option value="all">All props (incl. experimental)</option>
        ${[...new Set(all.map(p => p.c))].map(c => `<option value="c:${c}">${esc(L(c))}</option>`).join("")}</select>
      <select id="thr-side"><option value="">Over and Under picks</option><option value="over">Over picks</option><option value="under">Under picks</option></select>
      <select id="thr-date">${DATE_OPTS}</select>
      Breakeven <input id="thr-be" type="number" min="50" max="80" step="0.1" value="57.7" style="width:64px"> %</div>
    <div class="thr-grid" id="thr-out"></div>
    <div class="caveat">Every graded pick at or above each probability (${RAWMODE ? "raw model %" : "calibrated %"}). Record = hits-misses-pushes;
      pushes don't count in the hit rate. The white tick is your breakeven (57.7% = a 2-pick at 3×); green bars clear it.</div>

    ${show("ov", head)}
    <div id="ov-out"></div>

    <h2>Overs vs. Unders</h2>
    ${show("side", head)}
    <div id="side-out"></div>

    <h2>Overs vs. Unders by date</h2>
    <div class="caveat">Follows the prop and probability filters above.</div>
    <div class="table-wrap" id="bydate-out"></div>
    <div class="caveat">Based on the side the model picked; pushes excluded. Small samples swing a lot — treat anything under ~30 picks as noise.</div>

    <h2>Model vs. blind picks (the market test)</h2>
    <div class="caveat">Same PrizePicks lines, three ways to pick: the model's side, or ignore the model and take every line
      Over (or every line Under). The model only adds value if it beats the better blind side. The slope regresses
      (actual − line) on (model mean − line): 1 means the model's disagreement with the line is fully real, 0 means none.</div>
    ${show("mk", head, {prob: false})}
    <div id="mk-out"></div>

    <h2>Line movement (closing line check)</h2>
    <div class="caveat">Compares each pick's line with the last PrizePicks line seen before puck drop. "Toward model" means the line
      later rose on an Over pick or fell on an Under pick — the market came around to the model's side. That only means something
      if it beats how often lines simply drift the model's usual way, so the up/down share of all moved lines is shown alongside.
      The slope regresses (closing − pick line) on (model mean − pick line): above 0 means lines move toward the model.
      Lines are recorded every 30 minutes through game hours; "captured within" limits it to closing lines seen close to puck drop.</div>
    <div class="show">Show: <select id="mv-date"></select> <select id="mv-prop"></select>
      <select id="mv-grp"><option value="hd">Headline props</option><option value="exp">Experimental props</option><option value="all">Headline + experimental</option></select>
      <select id="mv-win"><option value="99999">Captured any time before puck drop</option><option value="180">Captured within 3 h of puck drop</option>
        <option value="60">Captured within 60 min</option></select></div>
    <div id="mv-out"></div>

    <h2>Time On Ice correlated pairs (experimental)</h2>
    <div class="caveat">Every same-team F1 + F2, F1 + D1 or D1 + D2 pair the Props page listed (both TOI legs, model picking the same
      direction). "Both hit" needs both legs to win; a push or void on either leg drops the pair. It only beats a 3× 2-pick if both-hit
      clears 33.3%. "Estimated" is what the Props page predicted (leg × leg × lift) — if actual tracks it, the lifts hold up on real lines.</div>
    <div class="show">Show: <select id="pr-date"></select></div>
    <div id="pr-out"></div>

    <h2>Experimental props</h2>
    <div class="caveat">New props still being validated. Their results are shown only here and are not counted in any other number on this page.</div>
    ${show("exp", exp)}
    <div id="exp-out"></div>

    <h2>By model confidence (calibration check)</h2>
    <div class="caveat">If the model is well-calibrated, its 60-65% bucket should hit close to 60-65% of the time — not more, not less.
      Don't recalibrate before ~100+ picks per prop.</div>
    ${show("cal", head, {prob: false})}
    <div class="table-wrap" id="cal-out"></div>

    <h2>Recent graded picks</h2>
    ${show("rec", all)}
    <div class="table-wrap" id="rec-out"></div>`;

  const drawOverall = () => {
    const rows = filt("ov", head), s = summarize(rows.map(p => p.x));
    let h = `<div class="overall-card">
        <div><div class="big">${pct(s.rate)}</div><div class="sub">overall hit rate</div></div>
        <div><div class="big">${s.n + s.pushes}</div><div class="sub">graded picks</div></div>
        <div><div class="big">${s.hits}</div><div class="sub">hits</div></div>
        <div><div class="big">${s.pushes}</div><div class="sub">pushes (excluded above)</div></div></div>
      <h2>By prop type</h2><div class="table-wrap"><table><thead><tr><th>Prop</th><th class="num">N</th><th class="num">Hit rate</th><th class="num">Pushes</th></tr></thead><tbody>`;
    for (const c of [...new Set(rows.map(p => p.c))]) {
      const t = summarize(rows.filter(p => p.c === c).map(p => p.x));
      h += `<tr><td>${esc(L(c))}</td><td class="num">${t.n}</td><td class="num">${pct(t.rate)}</td><td class="num">${t.pushes}</td></tr>`;
    }
    h += `</tbody></table></div><div class="caveat">Tracks every graded pick, not just ones that cleared a breakeven threshold — this is the model's real calibration, not a highlight reel.</div>`;
    document.getElementById("ov-out").innerHTML = rows.length ? h : `<div class="empty">No graded picks for this selection.</div>`;
  };

  const sideTable = rows => {
    let h = `<div class="table-wrap"><table><thead><tr><th>Prop</th><th class="num">Over N</th><th class="num">Over hit rate</th>
      <th class="num">Under N</th><th class="num">Under hit rate</th></tr></thead><tbody>`;
    for (const c of [...new Set(rows.map(p => p.c))]) {
      const o = summarize(rows.filter(p => p.c === c && p.s === "over").map(p => p.x));
      const u = summarize(rows.filter(p => p.c === c && p.s === "under").map(p => p.x));
      h += `<tr><td>${esc(L(c))}</td><td class="num">${o.n}</td><td class="num">${pct(o.rate)}</td><td class="num">${u.n}</td><td class="num">${pct(u.rate)}</td></tr>`;
    }
    return h + `</tbody></table></div>`;
  };

  const drawSide = () => {
    const rows = filt("side", head);
    const o = summarize(rows.filter(p => p.s === "over").map(p => p.x)), u = summarize(rows.filter(p => p.s === "under").map(p => p.x));
    document.getElementById("side-out").innerHTML = rows.length ? `<div class="overall-card">
        <div><div class="big">${pct(o.rate)}</div><div class="sub">Over hit rate (${o.n} picks)</div></div>
        <div><div class="big">${pct(u.rate)}</div><div class="sub">Under hit rate (${u.n} picks)</div></div></div>` + sideTable(rows)
      : `<div class="empty">No graded picks for this selection.</div>`;
    // by-date table follows this section's prop/probability filters
    const v = k => document.getElementById(`side-${k}`).value;
    const base = head.filter(p => (v("prop") === "__all__" || p.c === v("prop")) && inProb(p.p, v("prob")));
    let h = `<table><thead><tr><th>Date</th><th class="num">Graded N</th><th class="num">Overall</th><th class="num">Over N</th>
      <th class="num">Over hit rate</th><th class="num">Under N</th><th class="num">Under hit rate</th></tr></thead><tbody>`;
    for (const d of [...new Set(base.map(p => p.d))].sort().reverse()) {
      const day = base.filter(p => p.d === d), a = summarize(day.map(p => p.x));
      const dO = summarize(day.filter(p => p.s === "over").map(p => p.x)), dU = summarize(day.filter(p => p.s === "under").map(p => p.x));
      h += `<tr><td>${d}</td><td class="num">${a.n}</td><td class="num">${pct(a.rate)}</td><td class="num">${dO.n}</td><td class="num">${pct(dO.rate)}</td>
        <td class="num">${dU.n}</td><td class="num">${pct(dU.rate)}</td></tr>`;
    }
    document.getElementById("bydate-out").innerHTML = h + `</tbody></table>`;
  };

  const drawMarket = () => {
    const rows = filt("mk", head);
    if (!rows.length) { document.getElementById("mk-out").innerHTML = `<div class="empty">No graded picks for this selection.</div>`; return; }
    const m = summarize(rows.map(p => p.x)), o = summarize(rows.map(p => p.ox)), u = summarize(rows.map(p => p.ux));
    const avgP = rows.reduce((a, p) => a + p.p, 0) / rows.length, s = slope(rows);
    document.getElementById("mk-out").innerHTML = `<div class="table-wrap"><table><thead><tr><th>Method</th><th class="num">N</th>
        <th class="num">Hit rate</th><th class="num">Avg predicted prob</th></tr></thead><tbody>
      <tr><td>Model</td><td class="num">${m.n}</td><td class="num">${pct(m.rate)}</td><td class="num">${pct(avgP)}</td></tr>
      <tr><td>Blind Over (every line)</td><td class="num">${o.n}</td><td class="num">${pct(o.rate)}</td><td class="num">—</td></tr>
      <tr><td>Blind Under (every line)</td><td class="num">${u.n}</td><td class="num">${pct(u.rate)}</td><td class="num">—</td></tr>
      <tr><td>Slope (actual − line) on (model mean − line)</td><td class="num">${s ? rows.length : "—"}</td>
        <td class="num">${s ? s.b.toFixed(2) : "needs 10+ picks"}</td><td class="num">${s ? "± " + (1.96 * s.se).toFixed(2) + " (95% CI)" : "—"}</td></tr>
      </tbody></table></div>
      <div class="caveat">If "Avg predicted prob" is well above the model's hit rate, the model is overconfident.${m.n < 100 ? ` Only ${m.n} decided picks so far — too few to judge.` : ""}</div>`;
  };

  const drawExp = () => {
    const rows = filt("exp", exp);
    if (!rows.length) { document.getElementById("exp-out").innerHTML = `<div class="empty">No graded experimental picks for this selection yet.</div>`; return; }
    const s = summarize(rows.map(p => p.x));
    let h = `<div class="overall-card">
        <div><div class="big">${pct(s.rate)}</div><div class="sub">experimental hit rate</div></div>
        <div><div class="big">${s.n + s.pushes}</div><div class="sub">graded picks</div></div>
        <div><div class="big">${s.hits}</div><div class="sub">hits</div></div>
        <div><div class="big">${s.pushes}</div><div class="sub">pushes (excluded above)</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Prop</th><th class="num">N</th><th class="num">Hit rate</th><th class="num">Blind Over</th>
        <th class="num">Blind Under</th><th class="num">Over N</th><th class="num">Over hit rate</th><th class="num">Under N</th><th class="num">Under hit rate</th></tr></thead><tbody>`;
    for (const c of [...new Set(rows.map(p => p.c))]) {
      const r = rows.filter(p => p.c === c), t = summarize(r.map(p => p.x));
      const o = summarize(r.filter(p => p.s === "over").map(p => p.x)), u = summarize(r.filter(p => p.s === "under").map(p => p.x));
      h += `<tr><td>${esc(L(c))}</td><td class="num">${t.n}</td><td class="num">${pct(t.rate)}</td>
        <td class="num">${pct(summarize(r.map(p => p.ox)).rate)}</td><td class="num">${pct(summarize(r.map(p => p.ux)).rate)}</td>
        <td class="num">${o.n}</td><td class="num">${pct(o.rate)}</td><td class="num">${u.n}</td><td class="num">${pct(u.rate)}</td></tr>`;
    }
    document.getElementById("exp-out").innerHTML = h + `</tbody></table></div>`;
  };

  const drawCal = () => {
    const rows = filt("cal", head);
    let h = `<table><thead><tr><th>Confidence</th><th class="num">N</th><th class="num">Avg stated prob</th><th class="num">Hit rate</th><th class="num">Pushes</th></tr></thead><tbody>`;
    for (const [label, lo, hi] of BUCKETS) {
      const b = rows.filter(p => p.p >= lo && p.p < hi), s = summarize(b.map(p => p.x));
      const ap = b.length ? b.reduce((a, p) => a + p.p, 0) / b.length : null;
      h += `<tr><td>${label}</td><td class="num">${s.n}</td><td class="num">${pct(ap)}</td><td class="num">${pct(s.rate)}</td><td class="num">${s.pushes}</td></tr>`;
    }
    document.getElementById("cal-out").innerHTML = h + `</tbody></table>`;
  };

  const drawRecent = () => {
    const rows = filt("rec", all).sort((a, b) => b.d.localeCompare(a.d)).slice(0, 200);
    document.getElementById("rec-out").innerHTML = rows.length ? `<table><thead><tr><th>Date</th><th>Player</th><th>Matchup</th><th>Prop</th>
        <th class="num">Line</th><th>Pick</th><th class="num">Model prob</th><th class="num">Actual</th><th>Result</th></tr></thead><tbody>
      ${rows.map(p => `<tr><td>${p.d}</td><td>${esc(p.pl)}</td><td>${esc(p.tm)} v ${esc(p.op)}</td>
        <td>${esc(L(p.c))}${p.hd ? "" : " (experimental)"}</td><td class="num">${p.l}</td><td class="${p.s}">${p.s}</td>
        <td class="num">${pct(p.p)}</td><td class="num">${p.a}</td><td>${tag(p.x)}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">No graded picks for this selection.</div>`;
  };

  const moves = data.moves || [];
  const mvDates = [...new Set(moves.map(p => p.d))].sort().reverse();
  document.getElementById("mv-date").innerHTML = `<option value="__all__">All dates</option><option value="last7">Last 7 days</option>
    <option value="last30">Last 30 days</option>` + mvDates.map(d => `<option value="${d}">${d}</option>`).join("");
  document.getElementById("mv-prop").innerHTML = `<option value="__all__">All props</option>` +
    [...new Set(moves.map(p => p.c))].map(c => `<option value="${c}">${esc(L(c))}</option>`).join("");
  const drawMoves = () => {
    const v = k => document.getElementById(`mv-${k}`).value;
    const rows = moves.filter(p => inDate(p.d, v("date"), mvDates[0]) && (v("prop") === "__all__" || p.c === v("prop"))
      && (v("grp") === "all" || (v("grp") === "hd" ? p.hd : !p.hd)) && p.cm <= +v("win"));
    const out = document.getElementById("mv-out");
    if (!rows.length) { out.innerHTML = `<div class="empty">No picks with a recorded closing line for this selection yet.</div>`; return; }
    const stats = rs => {
      const mv = rs.filter(p => p.lc !== p.l0), up = mv.filter(p => p.lc > p.l0).length;
      const tw = mv.filter(p => (p.lc > p.l0) === (p.s === "over")).length;
      return {n: rs.length, moved: mv.length, up, down: mv.length - up, toward: tw,
              pm: rs.length ? mv.length / rs.length : null, pt: mv.length ? tw / mv.length : null,
              pu: mv.length ? up / mv.length : null, pd: mv.length ? (mv.length - up) / mv.length : null};
    };
    const t = stats(rows), sl = t.moved < 20 ? null : slopeXY(rows.map(p => p.m - p.l0), rows.map(p => p.lc - p.l0));
    const medCm = [...rows.map(p => p.cm)].sort((a, b) => a - b)[Math.floor(rows.length / 2)];
    let h = `<div class="overall-card">
        <div><div class="big">${pct(t.pt)}</div><div class="sub">moved toward model (${t.toward}/${t.moved})</div></div>
        <div><div class="big">${pct(t.pm)}</div><div class="sub">of ${t.n} lines moved</div></div>
        <div><div class="big">${pct(t.pu)}</div><div class="sub">moved lines that went up (blind Over)</div></div>
        <div><div class="big">${pct(t.pd)}</div><div class="sub">moved lines that went down (blind Under)</div></div>
        <div><div class="big">${sl ? sl.b.toFixed(2) : "—"}</div><div class="sub">${sl ? `slope ± ${(1.96 * sl.se).toFixed(2)} (95% CI)` : "slope (shown once 20+ lines have moved)"}</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Prop</th><th class="num">Picks</th><th class="num">Moved</th><th class="num">Toward model</th>
        <th class="num">Moved up</th><th class="num">Moved down</th></tr></thead><tbody>`;
    for (const c of [...new Set(rows.map(p => p.c))]) {
      const r = stats(rows.filter(p => p.c === c));
      h += `<tr><td>${esc(L(c))}</td><td class="num">${r.n}</td><td class="num">${r.moved} (${pct(r.pm)})</td><td class="num">${pct(r.pt)}</td>
        <td class="num">${pct(r.pu)}</td><td class="num">${pct(r.pd)}</td></tr>`;
    }
    const moved = rows.filter(p => p.lc !== p.l0).sort((a, b) => b.d.localeCompare(a.d)).slice(0, 50);
    h += `</tbody></table></div><div class="caveat">Median closing line captured ${medCm} min before puck drop.
      ${t.moved < 50 ? `Only ${t.moved} moved lines so far — far too few to judge.` : ""}</div>`;
    if (moved.length) h += `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Player</th><th>Prop</th><th>Pick</th>
      <th class="num">Pick line</th><th class="num">Closing line</th><th class="num">Model mean</th><th>Moved</th></tr></thead><tbody>
      ${moved.map(p => `<tr><td>${p.d}</td><td>${esc(p.pl)}</td><td>${esc(L(p.c))}</td><td class="${p.s}">${p.s}</td><td class="num">${p.l0}</td>
        <td class="num">${p.lc}</td><td class="num">${p.m.toFixed(2)}</td>
        <td>${(p.lc > p.l0) === (p.s === "over") ? tag("h").replace("HIT", "TOWARD") : tag("m").replace("MISS", "AWAY")}</td></tr>`).join("")}
      </tbody></table></div>`;
    out.innerHTML = h;
  };
  ["mv-date", "mv-prop", "mv-grp", "mv-win"].forEach(id => document.getElementById(id).addEventListener("change", drawMoves));
  drawMoves();

  const THR = RAWMODE ? [.55, .60, .65, .70] : [.52, .54, .56, .58];
  const drawThr = () => {
    const v = id => document.getElementById(id).value;
    const scope = v("thr-scope");
    const rows = all.filter(p => (scope === "all" || (scope === "hd" ? p.hd : p.c === scope.slice(2)))
      && (!v("thr-side") || p.s === v("thr-side")) && inDate(p.d, v("thr-date"), latest));
    const be = (+v("thr-be") || 57.7) / 100;
    document.getElementById("thr-out").innerHTML = THR.map(t => {
      const r = rows.filter(p => p.p >= t), s = summarize(r.map(p => p.x)), m = s.n - s.hits;
      const w = s.rate == null ? 0 : Math.min(100, s.rate * 100);
      return `<div class="thr-card"><div class="lbl">≥${Math.round(t * 100)}% prob</div>
        <div class="row"><span class="big">${pct(s.rate)}</span><span class="rec">${s.hits}-${m}-${s.pushes}</span></div>
        <div class="thr-bar"><div class="fill ${s.rate != null && s.rate >= be ? "" : "below"}" style="width:${w}%"></div>
          <div class="be" style="left:${be * 100}%"></div></div></div>`;
    }).join("");
  };
  ["thr-scope", "thr-side", "thr-date", "thr-be"].forEach(id =>
    document.getElementById(id).addEventListener(id === "thr-be" ? "input" : "change", drawThr));
  drawThr();

  const prs = data.pairs || [];
  const prDates = [...new Set(prs.map(p => p.d))].sort().reverse();
  document.getElementById("pr-date").innerHTML = `<option value="__all__">All dates</option><option value="last7">Last 7 days</option>
    <option value="last30">Last 30 days</option>` + prDates.map(d => `<option value="${d}">${d}</option>`).join("");
  const drawPairs = () => {
    const rows = prs.filter(p => inDate(p.d, document.getElementById("pr-date").value, prDates[0]));
    const out = document.getElementById("pr-out");
    if (!rows.length) { out.innerHTML = `<div class="empty">No graded pairs yet.</div>`; return; }
    const st = rs => { const h = rs.filter(p => p.x === "h").length;
      return {n: rs.length, h, rate: rs.length ? h / rs.length : null, est: rs.length ? rs.reduce((a, p) => a + p.est, 0) / rs.length : null}; };
    const t = st(rows), ci = t.n ? 1.96 * Math.sqrt(Math.max(t.rate * (1 - t.rate), .01) / t.n) : null;
    let h = `<div class="overall-card">
        <div><div class="big">${pct(t.rate)}</div><div class="sub">both legs hit (${t.h} of ${t.n} pairs)${ci != null ? ` ±${(ci * 100).toFixed(1)}` : ""}</div></div>
        <div><div class="big">${pct(t.est)}</div><div class="sub">average estimate</div></div>
        <div><div class="big">33.3%</div><div class="sub">3× 2-pick breakeven</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Pair type</th><th>Direction</th><th class="num">Pairs</th><th class="num">Both hit</th>
        <th class="num">Avg estimate</th></tr></thead><tbody>`;
    const keys = [...new Set(rows.map(p => p.kind + "|" + p.s))].sort();
    for (const k of keys) { const [kind, s] = k.split("|"), r = st(rows.filter(p => p.kind === kind && p.s === s));
      h += `<tr><td>${kind}</td><td class="${s}">both ${s}</td><td class="num">${r.n}</td><td class="num">${pct(r.rate)}</td><td class="num">${pct(r.est)}</td></tr>`; }
    h += `</tbody></table></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Team</th><th>Pair</th><th>Direction</th>
      <th class="num">Estimate</th><th>Result</th></tr></thead><tbody>
      ${[...rows].sort((a, b) => b.d.localeCompare(a.d)).slice(0, 60).map(p => `<tr><td>${p.d}</td><td>${esc(p.tm)}</td>
        <td>${esc(p.a)} + ${esc(p.b)} <span class="caveat">${p.kind}</span></td><td class="${p.s}">both ${p.s}</td>
        <td class="num">${pct(p.est)}</td><td>${tag(p.x)}</td></tr>`).join("")}</tbody></table></div>
      ${t.n < 100 ? `<div class="caveat">Only ${t.n} pairs so far — far too few to judge (the ± is the 95% margin).</div>` : ""}`;
    out.innerHTML = h;
  };
  document.getElementById("pr-date").addEventListener("change", drawPairs);
  drawPairs();

  const sections = {ov: drawOverall, side: drawSide, mk: drawMarket, exp: drawExp, cal: drawCal, rec: drawRecent};
  for (const [id, fn] of Object.entries(sections)) {
    content.querySelectorAll(`[id^="${id}-"]`).forEach(el => el.tagName === "SELECT" && el.addEventListener("change", fn));
    fn();
  }
}

let DATA = null;
let RAWMODE = false;
function redraw() {
  const raw = document.getElementById("calmode").value === "raw";
  RAWMODE = raw || !DATA.picks.some(p => p.pr != null);   // results built before calibration = raw %
  render(Object.assign({}, DATA, {picks: DATA.picks.map(p => raw && p.pr != null ? Object.assign({}, p, {p: p.pr}) : p)}));
}
fetch("data/results.json", {cache: "no-store"}).then(r => r.json()).then(data => {
  DATA = data;
  const c = data.calibration;
  if (c && data.picks.some(p => p.pr != null)) {
    document.getElementById("calbar").style.display = "";
    document.getElementById("calnote").textContent = `Calibrated = 50% + ${c.k_used} × (model % − 50%), because the raw model was overconfident.` +
      (c.k_fit != null ? ` Current best fit on ${c.n} graded picks: ${c.k_fit} (95% ${c.k_lo}–${c.k_hi}).` : "") +
      " Sides and hit rates are identical either way; only the stated % changes.";
    document.getElementById("calmode").addEventListener("change", redraw);
  }
  redraw();
})
  .catch(() => { document.getElementById("meta").textContent = "No results yet."; });
</script>
</body>
</html>

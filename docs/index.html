<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Prop Tracker</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<h1>NHL Prop Tracker</h1>
<div class="tag">Tracking only: does a model beat the PrizePicks line? Not betting advice.</div>
<nav>
  <a href="index.html" class="active">Today's lines</a>
  <a href="results.html">Results</a>
  <a href="backtest.html">Backtest</a>
</nav>
<div class="meta" id="meta">Loading...</div>
<div class="filters" id="filters"></div>
<div class="table-wrap" id="table"></div>
<div id="skipped"></div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => x == null ? "—" : (x * 100).toFixed(1) + "%";
const time = iso => new Date(iso).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"});

fetch("data/props.json", {cache: "no-store"}).then(r => r.json()).then(data => {
  const labels = data.labels || {};
  document.getElementById("meta").textContent =
    `Board pulled ${new Date(data.generated_at).toLocaleString()} · slate ${data.slate_dates.join(", ")} · ` +
    `model ${data.model_version} · history through ${data.history_through}`;
  const modeled = data.picks.filter(p => !p.skip_reason);
  const cats = [...new Set(modeled.map(p => p.category))];
  const dates = [...new Set(modeled.map(p => p.game_date))].sort();
  document.getElementById("filters").innerHTML = `
    <select id="f-date"><option value="">All dates</option>${dates.map(d => `<option>${d}</option>`).join("")}</select>
    <select id="f-cat"><option value="">All props</option>${cats.map(c => `<option value="${c}">${esc(labels[c] || c)}</option>`).join("")}</select>
    <select id="f-side"><option value="">Over and Under</option><option value="over">Over picks</option><option value="under">Under picks</option></select>
    <select id="f-group"><option value="">All lines</option><option value="hd">Headline only</option><option value="exp">Experimental only</option></select>
    <select id="f-sort"><option value="prob">Sort: model prob</option><option value="time">Sort: start time</option><option value="edge">Sort: mean − line</option></select>`;
  const draw = () => {
    const v = id => document.getElementById(id).value;
    let rows = modeled.filter(p => (!v("f-date") || p.game_date === v("f-date")) && (!v("f-cat") || p.category === v("f-cat"))
      && (!v("f-side") || p.side === v("f-side"))
      && (v("f-group") === "" || (v("f-group") === "hd" ? p.headline : !p.headline)));
    const s = v("f-sort");
    rows.sort((a, b) => s === "time" ? a.start_time.localeCompare(b.start_time)
      : s === "edge" ? Math.abs(b.model_mean - b.line) - Math.abs(a.model_mean - a.line) : b.prob - a.prob);
    if (!rows.length) { document.getElementById("table").innerHTML = `<div class="empty">No lines for this selection.</div>`; return; }
    document.getElementById("table").innerHTML = `<table><thead><tr>
      <th>Start</th><th>Player</th><th>Matchup</th><th>Prop</th><th class="num">Line</th><th class="num">Model mean</th>
      <th class="num">P(over)</th><th class="num">P(under)</th><th>Pick</th><th class="num">Prob</th><th>Line type</th></tr></thead><tbody>
      ${rows.map(p => `<tr><td>${time(p.start_time)}</td><td>${esc(p.player)}</td><td>${esc(p.team)} v ${esc(p.opp)}</td>
        <td>${esc(labels[p.category] || p.category)}</td><td class="num">${p.line}</td><td class="num">${p.model_mean.toFixed(2)}</td>
        <td class="num">${pct(p.p_over)}</td><td class="num">${pct(p.p_under)}</td>
        <td class="${p.side}">${p.side}</td><td class="num">${pct(p.prob)}</td>
        <td class="note">${p.headline ? "standard" : (p.adjusted_odds ? "standard, adjusted payout (experimental)" : "experimental")}</td></tr>`).join("")}
      </tbody></table>
      <div class="note">${rows.length} lines. Prob is the model's chance its side wins, ignoring pushes. Goblin/demon lines (Over-only) are never priced.</div>`;
  };
  document.querySelectorAll("#filters select").forEach(el => el.addEventListener("change", draw));
  draw();

  const skipped = data.picks.filter(p => p.skip_reason);
  if (skipped.length) {
    const by = {};
    skipped.forEach(p => (by[p.skip_reason] ||= []).push(p));
    document.getElementById("skipped").innerHTML = `<h2>Not priced (${skipped.length})</h2>` +
      Object.entries(by).map(([r, ps]) => `<div class="note"><b>${esc(r.replace(/_/g, " "))}</b> (${ps.length}): ` +
        [...new Set(ps.map(p => `${p.player} (${p.team}, ${labels[p.category] || p.category})`))].slice(0, 60).map(esc).join(", ")
        + (ps.length > 60 ? " …" : "") + `</div>`).join("");
  }
}).catch(() => { document.getElementById("meta").textContent = "No board data yet."; });
</script>
</body>
</html>
